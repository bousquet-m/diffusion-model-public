# gen6: gen5's VE recipe, with the message tensor product fixed.
#
# gen5 trained for 20 h and was converged by ~10-20k of its 150k steps (diagnose on
# step_10000/20000/45000/final is flat to within noise at every sigma). Two changes:
#
#   1. model.tp_mode: uvu — gen1-gen5 used a FullyConnectedTensorProduct with
#      shared_weights=False, so the radial net emitted a full uvw weight block
#      (16,064 weights) for EVERY edge: ~1.6 GB of weights materialized per layer per
#      forward, and Linear(32 -> 16064) alone was 531k of the 1.08M params. That is not
#      what NequIP does. "uvu" uses per-path weights (352/edge) + a Linear mix.
#      Measured at these irreps on CPU/640 atoms: fwd 14080 -> 250 ms, fwd+bwd
#      76769 -> 734 ms.
#   2. max_steps 150000 -> 30000 (headroom over gen5's ~10-20k convergence).
#
# NOTE: tp_mode changes the architecture — gen5 checkpoints are NOT loadable as uvu
# (and still load as fc, which is the schema default). This config trains a new model.
seed: 0
device: auto

data:
  sources:
    - {path: /scratch/midway3/bousquet/diffusion/data/640.extxyz, role: train_val}
  traj_id_regex: 'config_type=(\S+)'
  species: [In, O]
  stride: 1
  dedup_rmsd: 0.05

split:
  by: trajectory
  val_fraction: 0.2
  val_source_roles: [train_val]
  seed: 0

graph:
  cutoff: 5.0                      # RF = cutoff * n_layers = 10 A < box/2 (10.13 A on 640)
  max_neighbors: 40

mask:
  mask_frac: 0.10
  geometry: sphere
  center: box_center
  slab_axis: 2
  slab_side: top

diffusion:
  type: ve
  sigma_min: 0.01                  # A
  sigma_max: 0.75                  # A — small; never fully destroys the structure
  n_sigma_levels: 500              # ladder length (training samples levels; sampling anneals)
  langevin_steps: 5                # per level at sampling -> 500*5 = 2500 anneal steps
  langevin_step_lr: 1.0e-4         # tuned (step 3): 5x the 2e-5 default. Closed ~66% of the
                                   # low-frac coordination gap (d_coord -0.48 -> -0.16 @ 0.1)
                                   # and ~72% of the energy error, diversity intact. Near the
                                   # safe ceiling: step ~ lr*(sigma/sigma_min)^2 -> ~0.56 A at
                                   # sigma_max; 2e-4 (~1.1 A) risks instability. refine_steps
                                   # had ~no effect (under-coordination is set in the anneal,
                                   # not the final quench). Residual low-frac gap -> NVT (step 4).
  refine_steps: 100                # final no-external-noise refinement

model:                             # same irreps as gen5 — only the TP parameterization changes,
  name: e3nn_denoiser              # so diagnose vs gen5 isolates the tp_mode effect.
  n_layers: 2
  hidden_irreps: "64x0e + 32x1o + 8x2e"
  sh_lmax: 2
  radial_basis: 8
  sigma_embed_dim: 32
  tp_mode: uvu

train:
  batch_size: 4
  lr: 1.0e-3
  max_steps: 30000
  ema_decay: 0.999
  loss: dsm
  checkpoint_dir: checkpoints/gen6
  ckpt_every: 2500                 # finer than gen5: convergence lands in the first few k
  log_dir: runs/gen6
  log_every: 50
  val_every: 500

sampling:
  num_steps: 1000
  n_resample: 8
  n_samples: 8

mace:
  model_path: /scratch/midway3/bousquet/diffusion/data/scan_v3_swa.model
  relax_fmax: 0.05
  relax_steps: 200
  # NVT post-refinement (step 4) — NVT only (no NPT: potential unreliable for cell dynamics).
  nvt_temperature_K: 500.0
  nvt_timestep_fs: 1.0
  nvt_steps: 0                     # 0 = off; enable via sweep --nvt-steps (e.g. 200)
  nvt_friction_per_fs: 0.01

validation:
  rdf_rmax: 6.0
  rdf_bins: 240
  cn_cutoff_ino: 2.7
  tolerances: {rdf_peak_A: 0.1, mean_bond_A: 0.05}
